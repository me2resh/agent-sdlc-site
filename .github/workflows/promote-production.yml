name: Promote standards sites to production

# A merge to main publishes the same validated site build to production.
# workflow_dispatch remains available for an explicit retry or a selected ref.
# Both triggers require write access to this repository, so this workflow
# never runs pull request code from a fork.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch that passed staging"
        required: true
        default: main

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standards-site-dist
          path: apps/site/dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        site: [agentsdlc, orbit, agdr]
    env:
      AWS_ROLE_ARN: ${{ secrets.PRODUCTION_ROLE_ARN }}
      PRODUCTION_BUCKET: ${{ secrets.PRODUCTION_BUCKET }}
      PRODUCTION_DISTRIBUTION: ${{ secrets.PRODUCTION_DISTRIBUTION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standards-site-dist
          path: apps/site/dist
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate production target
        run: |
          test -n "$PRODUCTION_BUCKET" || { echo "Production bucket is not configured" >&2; exit 1; }
          test -n "$PRODUCTION_DISTRIBUTION" || { echo "Production distribution is not configured" >&2; exit 1; }
      - name: Sync static site
        run: aws s3 sync "apps/site/dist/${{ matrix.site }}" "s3://${PRODUCTION_BUCKET}/${{ matrix.site }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$PRODUCTION_DISTRIBUTION" --paths '/*'
