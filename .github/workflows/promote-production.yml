name: Promote standards sites to production

# A merge to main publishes the same validated site build to production.
# workflow_dispatch remains available for an explicit retry or a selected ref.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch that passed staging"
        required: true
        default: main

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: standards-site-dist
          path: apps/site/dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        site: [agentsdlc, orbit, agdr]
    env:
      AWS_ROLE_ARN: ${{ vars.PRODUCTION_ROLE_ARN }}
      PRODUCTION_BUCKET: ${{ vars.PRODUCTION_BUCKET }}
      PRODUCTION_DISTRIBUTION: ${{ vars.PRODUCTION_DISTRIBUTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: standards-site-dist
          path: apps/site/dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate production target
        run: |
          test -n "$PRODUCTION_BUCKET" || { echo "Production bucket is not configured" >&2; exit 1; }
          test -n "$PRODUCTION_DISTRIBUTION" || { echo "Production distribution is not configured" >&2; exit 1; }
      - name: Sync static site
        run: aws s3 sync "apps/site/dist/${{ matrix.site }}" "s3://${PRODUCTION_BUCKET}/${{ matrix.site }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$PRODUCTION_DISTRIBUTION" --paths '/*'
