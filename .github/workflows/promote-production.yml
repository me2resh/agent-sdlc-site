name: Promote standards sites to production

# A merge to main publishes the same validated site build to production.
# workflow_dispatch remains available for an explicit retry, and it takes
# no `ref` input. An `inputs.ref` value used to let a dispatch build and
# publish code from any branch, because the production environment's
# branch-protection rule checks `github.ref` (the branch the dispatch
# itself runs from), never `inputs.ref`. That gap let the two diverge.
# Removing the input, and gating both jobs on
# `github.ref == 'refs/heads/main'`, means every dispatch — like every
# push — builds and deploys the commit already on `main`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standards-site-dist
          path: apps/site/dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        site: [agentsdlc, orbit, agdr]
    env:
      AWS_ROLE_ARN: ${{ secrets.PRODUCTION_ROLE_ARN }}
      PRODUCTION_BUCKET: ${{ secrets.PRODUCTION_BUCKET }}
      PRODUCTION_DISTRIBUTION: ${{ secrets.PRODUCTION_DISTRIBUTION }}
    steps:
      - name: Check deploy configuration
        shell: bash
        run: |
          missing=0
          for v in AWS_ROLE_ARN PRODUCTION_BUCKET PRODUCTION_DISTRIBUTION; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not configured"; missing=1; fi
          done
          exit "$missing"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standards-site-dist
          path: apps/site/dist
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Sync static site
        run: aws s3 sync "apps/site/dist/${{ matrix.site }}" "s3://${PRODUCTION_BUCKET}/${{ matrix.site }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$PRODUCTION_DISTRIBUTION" --paths '/*'
