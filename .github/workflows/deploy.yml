name: Deploy standards sites to staging

# This workflow never checks out or runs pull request code. It only
# downloads the build artifact that "Site checks" (ci.yml) already
# produced in the unprivileged `pull_request` context, and publishes
# that artifact to protected staging.
#
# Trigger: it runs after "Site checks" completes (`workflow_run`).
# GitHub reads a `workflow_run`-triggered workflow's own file from the
# repository's default branch, never from the pull request that
# triggered the run it is reacting to — so a fork pull request cannot
# rewrite this file to reach the staging AWS role.
#
# Guard: `github.event.workflow_run.pull_requests` is empty when the
# completed "Site checks" run came from a fork pull request, and holds
# the pull request only when its head repository is this same
# repository. Every job below checks that array before it runs, which
# is what keeps a fork pull request away from AWS credentials. This
# replaces the previous `pull_request_target` trigger, which ran the
# pull request's own build (`npm ci` / `npm run build:all`) in this
# workflow's trusted context and let it write to the shared npm cache.
on:
  workflow_run:
    workflows: ["Site checks"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: standards-site-staging-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  deploy-staging:
    name: Publish staging (${{ matrix.site }})
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: staging
    strategy:
      fail-fast: false
      matrix:
        site: [agentsdlc, orbit, agdr]
    env:
      AWS_ROLE_ARN: ${{ secrets.STAGING_ROLE_ARN }}
      STAGING_BUCKET: ${{ secrets.STAGING_BUCKET }}
      STAGING_DISTRIBUTION: ${{ secrets.STAGING_DISTRIBUTION }}
    steps:
      - name: Download the build from the checked run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standards-site-dist
          path: apps/site/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve target
        id: target
        shell: bash
        run: |
          test -n "$STAGING_BUCKET" || { echo "Staging bucket is not configured" >&2; exit 1; }
          test -n "$STAGING_DISTRIBUTION" || { echo "Staging distribution is not configured" >&2; exit 1; }
      - name: Sync static site
        run: aws s3 sync "apps/site/dist/${{ matrix.site }}" "s3://${STAGING_BUCKET}/${{ matrix.site }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$STAGING_DISTRIBUTION" --paths '/*'

  report-staging:
    name: Report staging URLs
    needs: deploy-staging
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add staging links to pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0].number;
            const body = [
              '### Staging deployment',
              '',
              'The standards sites were built from this pull request and published to protected staging:',
              '',
              '- [Agent SDLC](https://standards.staging.apexyard.ai/)',
              '- [ORBIT](https://orbit.staging.standards.apexyard.ai/)',
              '- [AgDR](https://agdr.staging.standards.apexyard.ai/)',
              '',
              'Staging requires the configured basic-auth password.'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes('### Staging deployment'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
            }
