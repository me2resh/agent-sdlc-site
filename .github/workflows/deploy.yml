name: Deploy standards sites

# A successful main build is published to staging. Production promotion is a
# separate manual workflow so a user action is always required, even when the
# GitHub plan cannot enable environment required-reviewer rules. AWS access
# uses OIDC; no long-lived credentials are stored in this repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: standards-site-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  build:
    name: Build all sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: standards-site-dist
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    name: Publish staging (${{ matrix.site }})
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    strategy:
      fail-fast: false
      matrix:
        site: [agentsdlc, orbit, agdr]
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      STAGING_BUCKET: ${{ vars.STAGING_BUCKET }}
      STAGING_DISTRIBUTION: ${{ vars.STAGING_DISTRIBUTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standards-site-dist
          path: apps/site/dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve target
        id: target
        shell: bash
        run: |
          test -n "$STAGING_BUCKET" || { echo "Staging bucket is not configured" >&2; exit 1; }
          test -n "$STAGING_DISTRIBUTION" || { echo "Staging distribution is not configured" >&2; exit 1; }
      - name: Sync static site
        run: aws s3 sync "apps/site/dist/${{ matrix.site }}" "s3://${STAGING_BUCKET}/${{ matrix.site }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$STAGING_DISTRIBUTION" --paths '/*'
