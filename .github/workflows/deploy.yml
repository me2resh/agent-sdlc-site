name: Deploy standards sites to staging

# This workflow never checks out or runs pull request code. It only
# downloads the build artifact that "Site checks" (ci.yml) already
# produced in the unprivileged `pull_request` context, and publishes
# that artifact to protected staging.
#
# Trigger: it runs after "Site checks" completes (`workflow_run`).
# GitHub reads a `workflow_run`-triggered workflow's own file from the
# repository's default branch, never from the pull request that
# triggered the run it is reacting to — so a fork pull request cannot
# rewrite this file to reach the staging AWS role.
#
# Guard: every job below requires BOTH
#   - `github.event.workflow_run.head_repository.full_name == github.repository`,
#     the authoritative source-of-run check, GitHub's own record of which
#     repository the completed run built from, and
#   - `github.event.workflow_run.pull_requests[0] != null`, used only to
#     read the pull request number (for the concurrency group and the
#     staging comment).
# `pull_requests` is a derived, best-effort field (GitHub does not
# document it as a security boundary), so `head_repository` is the check
# that actually keeps a fork pull request away from AWS credentials.
# This replaces the previous `pull_request_target` trigger, which ran the
# pull request's own build (`npm ci` / `npm run build:all`) in this
# workflow's trusted context and let it write to the shared npm cache.
on:
  workflow_run:
    workflows: ["Site checks"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.workflow_run.pull_requests[0] && 'standards-site-staging' || format('standards-site-staging-{0}', github.event.workflow_run.id) }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  deploy-staging:
    name: Publish staging (${{ matrix.site }})
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: staging
    strategy:
      fail-fast: false
      matrix:
        site: [agentsdlc, orbit, agdr]
    env:
      AWS_ROLE_ARN: ${{ secrets.STAGING_ROLE_ARN }}
      STAGING_BUCKET: ${{ secrets.STAGING_BUCKET }}
      STAGING_DISTRIBUTION: ${{ secrets.STAGING_DISTRIBUTION }}
    steps:
      - name: Check deploy configuration
        shell: bash
        run: |
          missing=0
          for v in AWS_ROLE_ARN STAGING_BUCKET STAGING_DISTRIBUTION; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not configured"; missing=1; fi
          done
          exit "$missing"
      - name: Download the build from the checked run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standards-site-dist
          path: apps/site/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Sync static site
        run: aws s3 sync "apps/site/dist/${{ matrix.site }}" "s3://${STAGING_BUCKET}/${{ matrix.site }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$STAGING_DISTRIBUTION" --paths '/*'

  report-staging:
    name: Report staging URLs
    needs: deploy-staging
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add staging links to pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Staging is one shared environment for every open pull
            // request. The last deploy to finish wins, so each
            // staging comment must say which commit it shows and
            // when, and a previous owner's comment must say it moved
            // on. The concurrency group above queues every
            // pull-request-triggered run in one line
            // (cancel-in-progress: false), so only one report-staging
            // run updates comments at a time. Ownership is tracked
            // with a hidden HTML marker at the end of each bot
            // comment:
            //   <!-- staging-owner: current pr=<N> -->
            //   <!-- staging-owner: superseded pr=<N> -->
            // This step also defensively rewrites every open pull
            // request whose comment still carries a "current" marker
            // other than this run's own pull request, in case an
            // earlier run's comment update did not finish before this
            // run started.
            const STAGING_MARKER_HEADING = '### Staging deployment';
            // Only the platform's own `github-actions[bot]` app may
            // own staging. Its login cannot be registered by a user
            // account, and its numeric id is fixed by GitHub for every
            // repository. Matching both, plus requiring the heading at
            // the start of the body, keeps another installed app's
            // comment (or a human comment that copies the marker text)
            // from being read or rewritten as a staging owner.
            const STAGING_BOT_LOGIN = 'github-actions[bot]';
            const STAGING_BOT_ID = 41898282;
            const CURRENT_MARKER_RE = /<!-- staging-owner: current pr=(\d+) -->/;

            function isStagingBotComment(comment) {
              return comment.user?.login === STAGING_BOT_LOGIN &&
                comment.user?.id === STAGING_BOT_ID &&
                comment.body?.startsWith(STAGING_MARKER_HEADING);
            }

            function buildCurrentBody({ prNumber, shortSha, commitUrl, deployedAtUtc }) {
              return [
                STAGING_MARKER_HEADING,
                '',
                `Staging now shows [${shortSha}](${commitUrl}), deployed ${deployedAtUtc} UTC, from this pull request:`,
                '',
                '- [Agent SDLC](https://standards.staging.apexyard.ai/)',
                '- [ORBIT](https://orbit.staging.standards.apexyard.ai/)',
                '- [AgDR](https://agdr.staging.standards.apexyard.ai/)',
                '',
                'Staging requires the configured basic-auth password.',
                '',
                'Staging is shared by every open pull request. The latest deploy wins, so this comment stops being current the moment another pull request deploys.',
                '',
                `<!-- staging-owner: current pr=${prNumber} -->`
              ].join('\n');
            }

            function buildSupersededBody({ prNumber, newPrNumber, newPrUrl }) {
              return [
                STAGING_MARKER_HEADING,
                '',
                `Staging now shows [pull request #${newPrNumber}](${newPrUrl}). Staging is shared, and this pull request's build is no longer on it.`,
                '',
                `<!-- staging-owner: superseded pr=${prNumber} -->`
              ].join('\n');
            }

            const pr = context.payload.workflow_run.pull_requests[0];
            const runHeadSha = context.payload.workflow_run.head_sha;
            if (!pr || pr.head.sha !== runHeadSha) {
              core.info('Pull request head SHA does not match the checked run; skipping the staging comment.');
              return;
            }
            const prNumber = pr.number;
            const shortSha = runHeadSha.slice(0, 7);
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${runHeadSha}`;
            const deployedAtUtc = new Date().toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, '');
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;

            async function findStagingComment(issueNumber) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100
              });
              return comments.find(isStagingBotComment);
            }

            // Collect every open pull request whose comment still
            // carries a "current" marker other than this run's own
            // pull request. A fork pull request is skipped before its
            // comments are even read: both jobs above already refuse
            // to deploy a fork build, so a "current" marker there can
            // only be forged, never genuine. Each pull request's
            // lookup runs in its own try/catch, so one failing call
            // does not stop the rest of the scan.
            async function findStaleOwners() {
              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              const owners = [];
              for (const openPr of openPulls) {
                if (openPr.number === prNumber) continue;
                if (openPr.head?.repo?.full_name !== thisRepo) continue;
                try {
                  const comment = await findStagingComment(openPr.number);
                  const match = comment?.body?.match(CURRENT_MARKER_RE);
                  if (match && Number(match[1]) === openPr.number) {
                    owners.push({ prNumber: openPr.number, commentId: comment.id });
                  }
                } catch (error) {
                  core.warning(`Could not read staging comments on #${openPr.number}: ${error.message}`);
                }
              }
              return owners;
            }

            const currentBody = buildCurrentBody({ prNumber, shortSha, commitUrl, deployedAtUtc });
            const existing = await findStagingComment(prNumber);
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: currentBody });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body: currentBody });
            }

            // Updating a stale owner's comment is best-effort. A
            // failure here must never fail this job: the new staging
            // comment above already published the current state.
            try {
              const staleOwners = await findStaleOwners();
              const newPrUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`;
              for (const staleOwner of staleOwners) {
                const supersededBody = buildSupersededBody({ prNumber: staleOwner.prNumber, newPrNumber: prNumber, newPrUrl });
                await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: staleOwner.commentId, body: supersededBody });
              }
              if (staleOwners.length === 0) {
                core.info('No previous staging owner found; nothing to update.');
              }
            } catch (error) {
              core.warning(`Could not update a previous staging owner's comment: ${error.message}`);
            }
