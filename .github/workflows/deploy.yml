name: Deploy standards sites

# Every same-repository pull request is published to protected staging.
# Production is published by the separate workflow after a merge to main.
# Fork pull requests are build-only and never receive AWS credentials.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-site-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

jobs:
  build:
    name: Build all sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: standards-site-dist
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    name: Publish staging (${{ matrix.site }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: staging
    strategy:
      fail-fast: false
      matrix:
        site: [agentsdlc, orbit, agdr]
    env:
      AWS_ROLE_ARN: ${{ vars.STAGING_ROLE_ARN }}
      STAGING_BUCKET: ${{ vars.STAGING_BUCKET }}
      STAGING_DISTRIBUTION: ${{ vars.STAGING_DISTRIBUTION }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standards-site-dist
          path: apps/site/dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve target
        id: target
        shell: bash
        run: |
          test -n "$STAGING_BUCKET" || { echo "Staging bucket is not configured" >&2; exit 1; }
          test -n "$STAGING_DISTRIBUTION" || { echo "Staging distribution is not configured" >&2; exit 1; }
      - name: Sync static site
        run: aws s3 sync "apps/site/dist/${{ matrix.site }}" "s3://${STAGING_BUCKET}/${{ matrix.site }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$STAGING_DISTRIBUTION" --paths '/*'
