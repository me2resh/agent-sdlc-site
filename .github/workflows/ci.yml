name: Site checks

# Builds and checks every pull request, including a fork pull request,
# under the `pull_request` event. `pull_request` gives the job a
# read-only token and a build cache scoped to the pull request rather
# than shared with the base branch. This job references no secrets, so
# no secret is available to it, from a fork pull request or otherwise.
# The staging deploy workflow (deploy.yml) reads the uploaded artifact
# from here; it never checks out or runs this code itself.
on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:all
      - name: Upload built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standards-site-dist
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7
